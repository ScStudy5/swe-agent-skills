# Plantilla base de CI (GitHub Actions) endurecida con SHAs fijados
# Destino recomendado en tu repo: .github/workflows/ci.yml
# Nota: activa Dependabot (dependabot.yml) para mantener actualizados los SHAs fijados.

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Lint, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # - name: Setup Node.js (adapta o cambia por setup-python / setup-dotnet / setup-go)
      #   uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
      #   with:
      #     node-version: "22"
      #     cache: "npm"

      - name: Install dependencies (frozen lockfile)
        run: echo "Reemplaza con npm ci / uv sync --frozen / dotnet restore"

      - name: Lint & Format Check
        run: echo "Reemplaza con npm run lint / ruff check . / dotnet format --verify-no-changes"

      - name: Unit & Integration Tests
        run: echo "Reemplaza con npm test / pytest -q / dotnet test --no-build"

      - name: Build
        run: echo "Reemplaza con npm run build / dotnet build --no-restore"

  security-checks:
    name: Secret & Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Descomenta y adapta según tu gestor de paquetes o contenedores:
      # - name: Dependency audit (SCA)
      #   run: npm audit --audit-level=high
      #
      # - name: Container / FS vulnerability scan (Trivy)
      #   uses: aquasecurity/trivy-action@ad623e14ebdfe82b9627811d57b9a39e283d6128 # 0.30.0
      #   with:
      #     scan-type: fs
      #     severity: CRITICAL,HIGH
      #     exit-code: "1"
